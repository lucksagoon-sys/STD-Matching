<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เกมจับคู่มาตรฐานสากล - Mobile Friendly Edition</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #1a365d;
            margin-bottom: 5px;
            font-size: 1.5rem;
            text-align: center;
        }
        .header-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            background-color: #fff;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            box-sizing: border-box;
            gap: 10px;
        }
        @media (min-width: 768px) {
            .header-info {
                flex-direction: row;
                justify-content: space-between;
                padding: 15px 25px;
            }
        }
        .level-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2b6cb0;
        }
        .score-info {
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            gap: 15px;
        }
        .combo-text {
            color: #d69e2e;
            transition: all 0.3s ease;
        }
        .combo-active {
            color: #e53e3e;
            transform: scale(1.2);
        }
        
        /* ปรับ Layout ให้รองรับมือถือ (ซ้ายขวา เรียงเป็น บนล่าง แทนในจอเล็ก) */
        .game-board {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 1000px;
            width: 100%;
        }
        @media (min-width: 768px) {
            .game-board {
                flex-direction: row;
                gap: 40px;
            }
        }
        
        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        /* สไตล์ของตัวลาก (Draggable) */
        .draggable {
            background-color: #3182ce;
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: grab;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s, background-color 0.2s;
            user-select: none;
            touch-action: none; /* สำคัญ: ป้องกันหน้าจอเลื่อนเวลาแตะลากในมือถือ */
            position: relative; 
            z-index: 10;
        }
        .draggable.dragging {
            opacity: 0.8;
            transform: scale(1.05);
            z-index: 100;
        }
        .draggable.matched {
            background-color: #48bb78;
            cursor: default;
            pointer-events: none;
            margin: 0;
            width: 100%;
            box-sizing: border-box;
            position: static !important; /* ยกเลิก absolute เมื่อวางลงกล่อง */
            transform: none !important;
        }

        /* สไตล์ของกล่องวาง (Drop zone) */
        .drop-zone {
            background-color: #e2e8f0;
            border: 2px dashed #a0aec0;
            border-radius: 8px;
            padding: 15px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: left;
            transition: background-color 0.2s, border-color 0.2s;
            position: relative;
        }
        .drop-zone.drag-over {
            background-color: #edf2f7;
            border-color: #3182ce;
            border-style: solid;
        }
        .drop-zone.matched {
            background-color: #c6f6d5;
            border-color: #48bb78;
            border-style: solid;
            padding: 10px; /* ลด padding ลงเมื่อมีกล่องมาวาง */
        }
        .zone-text {
            font-size: 0.9rem;
            line-height: 1.4;
            pointer-events: none;
        }

        .next-level-btn {
            display: none;
            margin-top: 30px;
            background-color: #ed8936;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
            width: 100%;
            max-width: 300px;
        }
        .next-level-btn:hover {
            background-color: #dd6b20;
        }
        #game-over {
            display: none;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
            text-align: center;
        }
        #game-over h2 {
            color: #2f855a;
            font-size: 1.8rem;
        }
    </style>
</head>
<body>

    <h1>เกมจับคู่มาตรฐานสากล</h1>
    <p style="color: #4a5568; margin-bottom: 20px; font-size: 0.9rem; text-align: center;">แตะค้างแล้วลากชื่อองค์กรไปวางในหน้าที่ความรับผิดชอบ</p>

    <div class="header-info" id="header-info">
        <div class="level-title" id="level-title">Level 1: มาตรฐานที่เจอบ่อย</div>
        <div class="score-info">
            <div id="combo-display" class="combo-text">Combo: x1</div>
            <div id="score-display">คะแนน: 0</div>
        </div>
    </div>

    <div class="game-board" id="game-board">
        <!-- ฝั่งซ้าย: คำศัพท์ -->
        <div class="column" id="draggables-container"></div>
        <!-- ฝั่งขวา: คำอธิบาย -->
        <div class="column" id="dropzones-container"></div>
    </div>

    <button class="next-level-btn" id="next-level-btn">ไปด่านถัดไป ➔</button>

    <div id="game-over">
        <h2>🎉 ยินดีด้วย! คุณเคลียร์ครบทุกด่านแล้ว 🎉</h2>
        <div class="score-info" style="font-size: 1.5rem;" id="final-score">คะแนนรวม: 0</div>
        <button class="next-level-btn" style="display: block; margin-top: 20px;" onclick="location.reload()">เล่นใหม่อีกครั้ง</button>
    </div>

    <script>
        const levelsData = [
            {
                title: "Level 1: มาตรฐานที่เจอบ่อย",
                items: [
                    { id: "iso", name: "ISO", desc: "องค์กรมาตรฐานสากลที่พัฒนามาตรฐานระหว่างประเทศ ครอบคลุมการวิเคราะห์ทางเคมี การจัดการคุณภาพและความปลอดภัย[cite: 4]" },
                    { id: "tisi", name: "มอก. (สมอ.)", desc: "หน่วยงานมาตรฐานแห่งชาติของประเทศไทย พัฒนามาตรฐานผลิตภัณฑ์อุตสาหกรรม[cite: 6]" },
                    { id: "nimt", name: "มว. (NIMT)", desc: "สถาบันมาตรวิทยาแห่งชาติของไทย จัดหา รักษา และถ่ายทอดค่ามาตรฐานแห่งชาติ เช่น ดูแลตุ้มน้ำหนักมาตรฐาน[cite: 14]" }
                ]
            },
            {
                title: "Level 2: มาตรฐานด้านการทดลองและวัสดุ",
                items: [
                    { id: "glp", name: "GLP", desc: "ระบบคุณภาพการบริหารจัดการที่ควบคุมการศึกษาทดลองที่ไม่ใช่ทางคลินิก (Non-clinical) เช่น การทดสอบความเป็นพิษ[cite: 10]" },
                    { id: "astm", name: "ASTM", desc: "สมาคมที่พัฒนามาตรฐานสำหรับวัสดุต่างๆ เช่น โลหะ พลาสติก และเป็นค่ายหลักที่กำหนดมาตรฐานเกรดเครื่องแก้ว[cite: 12]" },
                    { id: "iupac", name: "IUPAC", desc: "องค์กรผู้กำหนดภาษากลาง เช่น ชื่อธาตุ ชื่อสารเคมีที่เป็นระบบ และการกำหนดค่าน้ำหนักอะตอมมาตรฐาน[cite: 9]" }
                ]
            },
            {
                title: "Level 3: มาตรฐานเฉพาะทางอุตสาหกรรม",
                items: [
                    { id: "aoac", name: "AOAC", desc: "พัฒนาวิธีการวิเคราะห์ที่ถูกต้องและเป็นกลางสำหรับอาหาร ยา และผลิตภัณฑ์ทางการเกษตร[cite: 18]" },
                    { id: "awwa", name: "AWWA", desc: "องค์กรที่พัฒนาและเผยแพร่มาตรฐานที่เกี่ยวข้องกับน้ำดื่มและโครงสร้างพื้นฐานระบบน้ำ[cite: 17]" },
                    { id: "uspnf", name: "USP-NF", desc: "องค์กรที่กำหนดมาตรฐานสำหรับความบริสุทธิ์ของยาและผลิตภัณฑ์สุขภาพอื่นๆ[cite: 19]" },
                    { id: "usepa", name: "US-EPA", desc: "หน่วยงานของรัฐบาลสหรัฐอเมริกาที่กำหนดมาตรฐานสำหรับการตรวจวัดสารปนเปื้อนในน้ำ อากาศ และดิน[cite: 16]" }
                ]
            }
        ];

        let currentLevelIndex = 0;
        let score = 0;
        let combo = 0;
        let currentMultiplier = 1;
        let matchesInCurrentLevel = 0;
        const basePoints = 100;

        const draggablesContainer = document.getElementById('draggables-container');
        const dropzonesContainer = document.getElementById('dropzones-container');
        const levelTitleElement = document.getElementById('level-title');
        const scoreDisplay = document.getElementById('score-display');
        const comboDisplay = document.getElementById('combo-display');
        const nextLevelBtn = document.getElementById('next-level-btn');
        const gameBoard = document.getElementById('game-board');
        const headerInfo = document.getElementById('header-info');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');

        // ตัวแปรสำหรับระบบ Touch
        let activeDraggedElement = null;
        let initialX = 0;
        let initialY = 0;
        let originalParent = null;
        let originalNextSibling = null;

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j =
